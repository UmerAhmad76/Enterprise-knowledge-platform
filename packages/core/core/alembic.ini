[alembic]
# Migration scripts ka folder, packages/core ke relative
script_location = core/db/migrations
# core package import ho sake, cwd (packages/core) ko sys.path mein add karo
prepend_sys_path = .
# File names: 20261111_<rev>_<slug>.py, taake sort order time ke hisaab se rahe
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s