name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -e "./packages/core[dev]" -e "./apps/api[dev]"

      - name: Core tests
        working-directory: packages/core
        run: pytest -q

      - name: API tests
        working-directory: apps/api
        run: pytest -q